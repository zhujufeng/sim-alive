<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SIM Alive - 海外手机号保号工具</title>
  <style>
    :root {
      color-scheme: light;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f4f2ec;
      color: #1f2933;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    main {
      width: min(100%, 460px);
      background: #fffdf8;
      border: 1px solid #ddd6c8;
      border-radius: 8px;
      padding: 24px;
      box-shadow: 0 16px 36px rgb(31 41 55 / 10%);
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      padding: 6px 10px;
      border-radius: 999px;
      background: #e8f4ef;
      color: #0f6b49;
      font-size: 13px;
      font-weight: 700;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 32px;
      line-height: 1.2;
    }

    p {
      margin: 0;
      color: #4b5560;
      line-height: 1.7;
    }

    .lead {
      font-size: 16px;
    }

    .meter {
      margin: 20px 0;
      padding: 16px;
      border-radius: 8px;
      background: #1f2933;
      border: 1px solid #1f2933;
    }

    .meter strong {
      display: block;
      margin-bottom: 4px;
      font-size: 26px;
      color: #fffdf8;
    }

    .meter p {
      color: #d9e2ec;
    }

    .checks {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin: 0 0 20px;
    }

    .check {
      padding: 10px 8px;
      border-radius: 8px;
      background: #f8f4ea;
      border: 1px solid #e7dcc9;
      text-align: center;
      font-size: 13px;
      color: #374151;
    }

    .proof {
      display: grid;
      gap: 10px;
      margin: 20px 0;
    }

    .proof div {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid #eee5d7;
      font-size: 14px;
      color: #4b5560;
    }

    .proof strong {
      color: #1f2933;
      text-align: right;
    }

    button {
      width: 100%;
      height: 48px;
      border: 0;
      border-radius: 8px;
      background: #0f6b49;
      color: #fff;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      cursor: wait;
      opacity: .65;
    }

    button:hover:not(:disabled) {
      background: #0b5439;
    }

    ul {
      margin: 20px 0 0;
      padding-left: 20px;
      color: #4b5563;
      line-height: 1.8;
    }

    #status {
      min-height: 28px;
      margin-top: 14px;
      font-weight: 700;
      color: #15803d;
    }

    #history {
      margin-top: 16px;
      font-size: 14px;
      color: #6b7280;
      white-space: pre-line;
    }

    footer {
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid #eee5d7;
      font-size: 14px;
      color: #6b7280;
    }

    a {
      color: #0f6b49;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">zhujufeng 开源维护</div>
    <h1>SIM Alive</h1>
    <p class="lead">给海外 SIM 轻量产生一次移动数据使用记录。适合 Giffgaff 等需要定期保持活跃的预付费手机号。</p>

    <section class="meter" aria-label="本次消耗">
      <strong>约 120 KB</strong>
      <p>单次探测流量。是否满足保号规则，以对应运营商记录为准。</p>
    </section>

    <div class="checks" aria-label="使用前检查">
      <div class="check">关闭 Wi-Fi</div>
      <div class="check">仅开浏览器数据</div>
      <div class="check">完成后断网</div>
    </div>

    <section class="proof" aria-label="请求机制">
      <div><span>防缓存</span><strong>随机 URL + no-store</strong></div>
      <div><span>隐私</span><strong>无后台、无统计</strong></div>
      <div><span>适用</span><strong>海外 SIM 移动数据保号</strong></div>
    </section>

    <button id="run" type="button">开始保号</button>
    <p id="status" role="status"></p>
    <p id="history"></p>

    <ul>
      <li>先关闭 Wi-Fi，只保留移动数据。</li>
      <li>尽量关闭其他应用的联网权限。</li>
      <li>完成后立即关闭移动数据。</li>
    </ul>

    <footer>
      由 zhujufeng 开源维护：
      <a id="source" href="https://github.com/zhujufeng/sim-alive" rel="noopener">查看源码</a>
    </footer>
  </main>

  <script>
    const button = document.querySelector("#run");
    const status = document.querySelector("#status");
    const history = document.querySelector("#history");
    const key = "sim-alive-history";

    function renderHistory() {
      const records = JSON.parse(localStorage.getItem(key) || "[]");
      history.textContent = records.length
        ? `最近记录：\n${records.slice(0, 3).join("\n")}`
        : "";
    }

    button.addEventListener("click", async () => {
      button.disabled = true;
      status.textContent = "正在消耗流量...";

      try {
        const bust = `${Date.now()}-${Math.random().toString(36).slice(2)}`;
        const url = new URL("payload.txt", location.href);
        url.searchParams.set("v", bust);
        const res = await fetch(url, {
          cache: "no-store",
          headers: {
            "Cache-Control": "no-store, max-age=0",
            Pragma: "no-cache"
          }
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);

        const size = (await res.blob()).size;
        const kb = (size / 1024).toFixed(1);
        status.textContent = `完成：已拉取 ${kb} KB`;

        const records = JSON.parse(localStorage.getItem(key) || "[]");
        records.unshift(`${new Date().toLocaleString()} - ${kb} KB`);
        localStorage.setItem(key, JSON.stringify(records.slice(0, 10)));
        renderHistory();
      } catch (error) {
        status.textContent = "失败：请确认网页和 payload.txt 在同一目录";
      } finally {
        button.disabled = false;
      }
    });

    renderHistory();
  </script>
</body>
</html>
